<style>
#color-dot-grid {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  place-items: center;
  width: min(100%, 720px);
  aspect-ratio: 1;
  margin-inline: auto;
  container-type: inline-size;
}
#color-dot-grid span {
  width: calc(var(--diameter) * 100cqw / 720);
  aspect-ratio: 1;
  border-radius: 50%;
  background-color: var(--ink);
}
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #fff;
  --red: #e74c55;
  --orange: #ed8735;
  --yellow: #e9bb28;
  --green: #24a66a;
  --blue: #397be8;
  --purple: #9256d7;
  --primary: #dd56a1;
}
#color-dot-grid {
  width: min(100%, 100vmin, 720px);
}
#color-dot-grid span {
  transform: scale(var(--neighbor-scale, 1));
  transition: transform 160ms ease, background-color 160ms ease;
}
#color-dot-grid span.is-active {
  transform: scale(1.2);
  background-color: #808080;

  z-index: 1;
}
@media (prefers-reduced-motion: reduce) {
  #color-dot-grid span {
    transition: none;
  }
}
</style>
<script>
  const grid = document.getElementById('color-dot-grid');
  const dots = Array.from(grid.querySelectorAll('span'));
  const columns = 10;
  const radius = 2.5;
  const maxShrink = 0.4;

  function updateNeighbors(activeIndex) {
    if (activeIndex === previousIndex) return;
    dots[previousIndex]?.classList.remove('is-active');
    dots[activeIndex]?.classList.add('is-active');
    previousIndex = activeIndex;
    const activeRow = Math.floor(activeIndex / columns);
    const activeColumn = activeIndex % columns;

    dots.forEach((dot, index) => {
      const row = Math.floor(index / columns);
      const column = index % columns;
      const distance = Math.hypot(row - activeRow, column - activeColumn);
      if (activeIndex < 0 || distance === 0 || distance >= radius) {
        dot.style.removeProperty('--neighbor-scale');
        return;
      }
      const shrink = maxShrink * (radius - distance) / (radius - 1);
      dot.style.setProperty('--neighbor-scale', 1 - shrink);
    });
  }

  let previousIndex = -1;

  grid.addEventListener('pointermove', (event) => {
    if (event.pointerType === 'touch') return;

    const bounds = grid.getBoundingClientRect();
    const cellWidth = bounds.width / columns;
    const cellHeight = bounds.height / columns;
    const x = (event.clientX - bounds.left) / cellWidth;
    const y = (event.clientY - bounds.top) / cellHeight;
    const column = Math.min(columns - 1, Math.max(0, Math.floor(x)));
    const row = Math.min(columns - 1, Math.max(0, Math.floor(y)));
    const distance = Math.hypot(x - column - 0.5, y - row - 0.5);
    updateNeighbors(distance <= 0.65 ? row * columns + column : -1);
  });
  grid.addEventListener('pointerleave', () => updateNeighbors(-1));
  grid.addEventListener('pointercancel', () => updateNeighbors(-1));
</script>
